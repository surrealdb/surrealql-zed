# Guards the checks that a Zed extensions submission runs against us, so a
# broken manifest or an unfetchable grammar pin fails here rather than in
# zed-industries/extensions' `package` job.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          # Matches the toolchain zed-industries/extensions packages with.
          toolchain: '1.90'
          target: wasm32-wasip2
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      # --locked so a Cargo.lock that does not match Cargo.toml fails here.
      # Without it cargo silently regenerates the lock in the runner, and a
      # stale committed one — the bump workflow writes it — passes unnoticed.
      - name: Clippy
        run: cargo clippy --locked --target wasm32-wasip2 --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --release --target wasm32-wasip2

  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Parse extension.toml, language config, and snippets
        run: |
          python3 - <<'PY'
          import json, sys, tomllib

          failed = False

          for path in ('extension.toml', 'Cargo.toml', 'languages/surql/config.toml'):
              try:
                  tomllib.load(open(path, 'rb'))
                  print(f'ok   {path}')
              except Exception as err:
                  print(f'::error file={path}::{err}')
                  failed = True

          try:
              snippets = json.load(open('snippets/surql-snippets.json'))
              print(f'ok   snippets/surql-snippets.json ({len(snippets)} entries)')
          except Exception as err:
              print(f'::error file=snippets/surql-snippets.json::{err}')
              failed = True

          extension_version = tomllib.load(open('extension.toml', 'rb'))['version']
          cargo_version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          if extension_version != cargo_version:
              print(
                  f'::error file=Cargo.toml::version {cargo_version} does not match '
                  f'extension.toml {extension_version}'
              )
              failed = True

          sys.exit(1 if failed else 0)
          PY

  queries:
    name: Validate queries against the pinned grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Fetch the grammar at the pinned revision
        run: scripts/fetch-grammar.sh grammar

      - name: Install tree-sitter CLI
        env:
          # Matches the `tree-sitter-cli` the grammar repo generates with.
          TREE_SITTER_VERSION: v0.26.8
        run: |
          curl -fsSL \
            "https://github.com/tree-sitter/tree-sitter/releases/download/$TREE_SITTER_VERSION/tree-sitter-linux-x64.gz" \
            | gunzip > "$RUNNER_TEMP/tree-sitter"
          chmod +x "$RUNNER_TEMP/tree-sitter"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # `tree-sitter query --quiet` only proved that a query compiles, and a
      # query that compiles but matches nothing compiles just as happily. This
      # compares the captures each query actually produces against a committed
      # baseline, and fails the fixture parsing with any ERROR or MISSING node.
      - name: Check query captures against the baseline
        run: scripts/check-queries.py grammar
