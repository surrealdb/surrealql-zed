name = 'Surreal Query Language'
grammar = 'surrealql'
language_servers = ['surrealql-lsp']
hard_tabs = false
tab_size = 4
path_suffixes = ['surql', 'surrealql']
line_comments = ['-- ', '# ', '// ']
block_comment = { start = '/*', end = '*/', prefix = '', tab_size = 2 }
word_characters = ['$', ':', '@', '_']
autoclose_before = ':;.,=}])>'
brackets = [
    { start = '<', end = '>', close = true, newline = true },
    { start = '{', end = '}', close = true, newline = true },
    { start = '[', end = ']', close = true, newline = true },
    { start = '(', end = ')', close = true, newline = true },
    { start = '"', end = '"', close = true, newline = true, not_in = ['string'] },
    { start = "'", end = "'", close = true, newline = true, not_in = ['string'] },
    { start = '/*', end = ' */', close = true, newline = true, not_in = ['string', 'comment'] },
]
